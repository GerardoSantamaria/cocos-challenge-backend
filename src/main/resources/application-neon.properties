# Handoff profile. The datasource comes from the environment, never from this file.
#   SPRING_DATASOURCE_URL=jdbc:postgresql://HOST/neondb?sslmode=require
#   SPRING_DATASOURCE_USERNAME=
#   SPRING_DATASOURCE_PASSWORD=
# Keep sslmode=require. Do not put the user or the password in the URL.
spring.datasource.hikari.maximum-pool-size=3
