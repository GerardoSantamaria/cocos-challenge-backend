# DB_TARGET chooses the database. Compose reads it from the shell or from a gitignored .env.
#   local (default): the postgres service below, loaded with database.sql
#   neon: SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD
services:
  postgres:
    profiles: ["local"]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-cocos}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-cocos}
      POSTGRES_DB: cocos
    volumes:
      - ./src/test/resources/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LOCAL_DB_USERNAME:-cocos} -d cocos"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_TARGET: ${DB_TARGET:-local}
      LOCAL_DB_USERNAME: ${LOCAL_DB_USERNAME:-cocos}
      LOCAL_DB_PASSWORD: ${LOCAL_DB_PASSWORD:-cocos}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
